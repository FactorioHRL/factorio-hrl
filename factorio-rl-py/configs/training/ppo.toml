# Masked PPO (sb3-contrib). Run:  python -m factorio_rl.train --task <task.toml> --training <this file>
name = "ppo"
algorithm = "maskable_ppo"      # or "genetic"
seed = 0
device = "cpu"                  # the network is small: CPU is usually faster than CUDA
out_dir = "runs"

[ppo]
total_timesteps = 500_000       # upper bound; the stop conditions below may end training earlier
n_envs = 4                      # parallel environments
n_steps = 512                   # steps per environment per update
n_epochs = 10                   # optimisation epochs over each batch of collected steps
batch_size = 256
learning_rate = 3e-4
gamma = 0.99
ent_coef = 0.01

[model]                         # the network: "mlp" (default) or "cnn"; see src/factorio_rl/models/
architecture = "mlp"

[evaluation]
every = 20_000                  # timesteps between evaluations
episodes = 20                   # fixed tasks the agent is compared with the brute-force expert on

[stop]
target_vs_expert = 0.98         # stop when mean agent score >= this share of the expert's mean score
patience = 8                    # ... or after this many evaluations without a better mean score

[live]                          # browser view of the evaluated layouts (see the README)
enabled = false
port = 8000
game_dir = "../data/game"                   # e.g. "../data/game" for real sprites

[reward]                        # optional: weights of the reward terms (see REWARDS.md); these are the defaults
# output = 1.0
# waste = -1.0
# adjacency = 0.05
# line = 0.05
# stray = -0.05

[tracking]                      # MLflow: params once, a few metrics per evaluation, a few files at the end
enabled = true
uri = "sqlite:///runs/mlflow.db"
artifact_dir = "runs/mlartifacts"
log_model = false               # copy best.zip (10-30 MB) into MLflow too; it is already in the run directory
