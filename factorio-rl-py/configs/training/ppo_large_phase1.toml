# Phase 1 of 2: learn to meet the output with little waste, with the layout-shape terms off.
# Watch `eval_term_output` reach 1 and `eval_term_waste` / `eval_term_enclosed` shrink in MLflow, then
# continue with ppo_large_phase2.toml from this run's best.zip. Everything else is ppo_large.toml.
# Masked PPO for big tasks (e.g. production science: 11 kinds of machine on a 32x32 grid).
# The brute-force expert only covers two kinds, so the reference score is the ideal 1.0 and
# `target_vs_expert` is the share of that ideal; integer machine counts keep it below 1.
name = "ppo-large-phase1"
algorithm = "maskable_ppo"
seed = 0
device = "cuda"
out_dir = "runs"

[ppo]
total_timesteps = 3_000_000
n_envs = 8
n_steps = 512
n_epochs = 10
batch_size = 512
learning_rate = 3e-4
gamma = 0.995
ent_coef = 0.01

[model]                         # the network: "mlp" (default) or "cnn"; see src/factorio_rl/models/
architecture = "mlp"

[evaluation]
every = 50_000
episodes = 10

[stop]
target_vs_expert = 0.9
patience = 20

[live]
enabled = false
port = 8000
game_dir = "../data/game"         

[reward]                        # shape terms off: only output, waste and enclosed machines count
adjacency = 0
line = 0
stray = 0
[tracking]                      # MLflow: params once, a few metrics per evaluation, a few files at the end
enabled = true
uri = "sqlite:///runs/mlflow.db"
artifact_dir = "runs/mlartifacts"
log_model = false               # copy best.zip (10-30 MB) into MLflow too; it is already in the run directory
